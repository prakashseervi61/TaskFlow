spring:
  application:
    name: taskflow-worker

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:taskflow}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}

  flyway:
    enabled: true
    locations: classpath:db/migration
    # An existing v0.2 database has no flyway_schema_history; adopt it at version 1 so
    # V1__baseline is treated as already applied and only V2 runs against it.
    baseline-on-migrate: true
    baseline-version: 1

  jpa:
    hibernate:
      # Flyway owns the schema; Hibernate only verifies the mapping matches it.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: ${REDIS_TIMEOUT:2s}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:2s}

taskflow:
  queue:
    key: ${JOB_QUEUE_KEY:taskflow:jobs}
  execution:
    # Stands in for real work. 0 executes immediately.
    simulated-duration-ms: ${JOB_SIMULATED_DURATION_MS:2500}
  retry:
    default-max-attempts: ${JOB_DEFAULT_MAX_ATTEMPTS:3}
    base-delay: ${JOB_RETRY_BASE_DELAY:5s}
    max-delay: ${JOB_RETRY_MAX_DELAY:5m}

worker:
  # Jobs one instance executes at the same time. Run more instances to scale out.
  concurrency: ${WORKER_CONCURRENCY:2}
  # Blocking read timeout; also how long a shutdown waits.
  poll-timeout: ${WORKER_POLL_TIMEOUT:5s}
  # Re-publish jobs still marked QUEUED when this worker starts.
  recover-queued-on-startup: ${WORKER_RECOVER_ON_STARTUP:true}
  # Message used by the FAIL job type.
  failure-message: ${WORKER_FAILURE_MESSAGE:Job failed on purpose}
  # How often to promote retries whose backoff has elapsed.
  retry-scan-interval-ms: ${WORKER_RETRY_SCAN_INTERVAL_MS:1000}
