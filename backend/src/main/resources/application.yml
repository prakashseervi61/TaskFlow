spring:
  application:
    name: taskflow-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:taskflow}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}

  flyway:
    enabled: true
    locations: classpath:db/migration
    # An existing v0.2 database has no flyway_schema_history; adopt it at version 1 so
    # V1__baseline is treated as already applied and only V2 runs against it.
    baseline-on-migrate: true
    baseline-version: 1

  jpa:
    hibernate:
      # Flyway owns the schema; Hibernate only verifies the mapping matches it.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: ${REDIS_TIMEOUT:2s}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:2s}
      lettuce:
        pool:
          enabled: true
          max-active: 8
          max-idle: 8

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-message: always

# Allowed origins for the React dev server (comma separated).
taskflow:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  queue:
    key: ${JOB_QUEUE_KEY:taskflow:jobs}
  retry:
    default-max-attempts: ${JOB_DEFAULT_MAX_ATTEMPTS:3}
    base-delay: ${JOB_RETRY_BASE_DELAY:5s}
    max-delay: ${JOB_RETRY_MAX_DELAY:5m}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.taskflow: INFO